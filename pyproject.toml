[project]
name = "SM-Data-Governance"
version = "2.0.0"
description = "数据治理平台：资产目录、脱敏规则、数据血缘与质量检测"
requires-python = ">=3.11"

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
